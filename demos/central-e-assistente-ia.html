<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central e Assistente IA</title>
<meta name="description" content="Demonstração navegável da Central de Aplicações e do Assistente IA (dados fictícios).">
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafb; --text: #16202a; --muted: #5a6776; --faint: #8a95a3;
  --border: #e1e6eb; --accent: #0f6b7a; --accent-strong: #0b5562; --accent-soft: #e2f1f3; --on-accent: #ffffff;
  --ok: #1d8f52; --warn: #b7800b; --off: #8a95a3; --danger: #c0392b; --danger-soft: #fbe9e7;
  --shadow: 0 1px 2px rgba(16,24,32,.06), 0 4px 16px rgba(16,24,32,.06);
  --radius: 14px; --radius-sm: 9px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #151c23; --surface-2: #1a222b; --text: #e5eaef; --muted: #9aa7b4; --faint: #6f7d8a;
    --border: #26313c; --accent: #4bb0c1; --accent-strong: #6cc3d2; --accent-soft: #15333a; --on-accent: #08161a;
    --ok: #3cc47f; --warn: #e0a930; --off: #6f7d8a; --danger: #ef6f61; --danger-soft: #3a1f1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #151c23; --surface-2: #1a222b; --text: #e5eaef; --muted: #9aa7b4; --faint: #6f7d8a;
  --border: #26313c; --accent: #4bb0c1; --accent-strong: #6cc3d2; --accent-soft: #15333a; --on-accent: #08161a;
  --ok: #3cc47f; --warn: #e0a930; --off: #6f7d8a; --danger: #ef6f61; --danger-soft: #3a1f1c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* barra da demonstração */
.demo { position: sticky; top: 0; z-index: 30; background: var(--text); color: var(--bg); }
.demo .in { max-width: 1200px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.demo b { font-weight: 650; letter-spacing: .2px; }
.demo .tag { font-size: 12px; opacity: .75; }
.demo .grp { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.demo select, .demo .seg button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); color: var(--bg); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
.demo select option { color: #16202a; }
.demo .seg { display: inline-flex; border-radius: 9px; overflow: hidden; }
.demo .seg button { border-radius: 0; }
.demo .seg button:first-child { border-radius: 8px 0 0 8px; }
.demo .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
.demo .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); }
.demo .push { margin-left: auto; }

/* casca dos apps */
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.top { background: var(--surface); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.marca > div { min-width: 0; }
.marca .t2 { overflow: hidden; text-overflow: ellipsis; }
.top .acoes { flex: none; }
.logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-weight: 750; font-size: 14px; letter-spacing: .5px; flex: none; }
.marca .t1 { font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca .t2 { color: var(--muted); font-size: 12.5px; line-height: 1.2; white-space: nowrap; }
.top .acoes { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.quem { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.selo { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; }
.selo:hover { background: var(--accent); color: var(--on-accent); }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
.ib:hover { color: var(--text); background: var(--surface-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.forte { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.forte:hover { background: var(--accent-strong); }
.btn.mini { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.perigo { color: var(--danger); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* página inicial */
.ola { padding: 28px 0 8px; }
.ola h1 { margin: 0; font-size: 24px; letter-spacing: -.2px; }
.ola p { margin: 4px 0 0; color: var(--muted); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 18px 0 32px; }
.card { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-height: 170px; transition: transform .15s ease, border-color .15s ease; animation: entra .45s ease both; }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.card .cab { display: flex; align-items: center; justify-content: space-between; }
.card .ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.card .ico svg { width: 21px; height: 21px; }
.card h3 { margin: 6px 0 0; font-size: 17px; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .cod { margin-top: auto; font: 11px/1 var(--mono); letter-spacing: 1px; color: var(--faint); }
.sit { display: inline-flex; align-items: center; gap: 6px; font: 10.5px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.led.ok { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulsa 2.2s infinite; }
.led.warn { background: var(--warn); }
@keyframes pulsa { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card, .led.ok { animation: none; } }
.vazio { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--border); border-radius: var(--radius); margin: 18px 0 32px; }

/* entrada */
.entrada { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 32px 16px; }
.caixa { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; text-align: center; }
.caixa .logo { margin: 0 auto 12px; width: 48px; height: 48px; font-size: 17px; border-radius: 13px; }
.caixa h1 { font-size: 21px; margin: 0; }
.caixa p { color: var(--muted); margin: 6px 0 18px; }
.caixa .btn { width: 100%; justify-content: center; margin-top: 8px; padding: 11px 14px; }
.aviso-caixa { text-align: left; background: var(--accent-soft); border-radius: 12px; padding: 14px; color: var(--text); font-size: 14px; }

/* rodapé e crédito */
.rodape { text-align: center; padding: 18px 16px 26px; color: var(--faint); font-size: 11.5px; position: relative; }
.rodape .nota { display: block; margin-bottom: 6px; }
.credito-btn { background: none; border: 0; padding: 2px 4px; color: var(--faint); font-size: 11.5px; letter-spacing: .2px; }
.credito-btn:hover, .credito-btn[aria-expanded="true"] { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.painel { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: 64px; width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; text-align: left; z-index: 40; animation: entra .2s ease both; }
.painel h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }
.painel a { color: var(--accent); font-weight: 650; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.painel a:hover { text-decoration: underline; }
.painel p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.painel .x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; background: none; color: var(--muted); border-radius: 8px; }

/* administração */
.adm-cab { display: flex; align-items: center; gap: 12px; padding: 22px 0 6px; flex-wrap: wrap; }
.adm-cab h1 { margin: 0; font-size: 22px; }
.voltar { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); background: none; border: 0; padding: 4px 0; font-size: 14px; }
.voltar:hover { color: var(--text); }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; margin-top: 10px; scrollbar-width: thin; }
.abas button { border: 0; background: none; padding: 10px 12px; color: var(--muted); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.abas button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.cont { background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 18px; }
.painel-adm { padding: 18px 0 40px; }
.linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.linha-acoes .dica { color: var(--muted); font-size: 13.5px; margin-right: auto; }
.lista { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.item.arrastando { opacity: .85; border-color: var(--accent); box-shadow: var(--shadow); }
.alca { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px dashed var(--border); background: none; color: var(--muted); cursor: grab; touch-action: none; flex: none; }
.alca:active { cursor: grabbing; }
.alca.trava { border-style: solid; cursor: not-allowed; color: var(--faint); }
.item .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.item .txt { min-width: 0; flex: 1; }
.item .tt { font-weight: 650; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .sub { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.no { color: var(--danger); }
.ordem-barra { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 8px 12px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; }
.ordem-barra .acoes { margin-left: auto; display: flex; gap: 6px; }
body.ordenando { user-select: none; }
.pessoa { flex-direction: column; align-items: stretch; }
.pessoa .topo-p { display: flex; gap: 12px; align-items: center; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--muted); flex: none; }
.det { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; display: grid; gap: 10px; }
.chk { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.chk label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.ve { display: flex; flex-wrap: wrap; gap: 6px; }
.blocos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.bloco { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.bloco h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.bloco p, .bloco li { color: var(--muted); font-size: 14px; margin: 4px 0; }
.bloco ul { margin: 6px 0 0; padding-left: 18px; }
.hist .item { align-items: flex-start; }
.hist time { font: 12px var(--mono); color: var(--faint); white-space: nowrap; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.sw:last-child { border-bottom: 0; }
.tg { width: 42px; height: 24px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); position: relative; flex: none; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--faint); transition: left .15s; }
.tg[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.tg[aria-checked="true"]::after { left: 20px; background: var(--on-accent); }

/* janela de formulário */
.fundo { position: fixed; inset: 0; background: rgba(8,12,16,.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.janela { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
.janela h2 { margin: 0 0 14px; font-size: 18px; }
.campo { display: grid; gap: 5px; margin-bottom: 12px; }
.campo > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px; padding: 9px 11px; }
.campo .ajuda { font-size: 12.5px; color: var(--faint); }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.erro { color: var(--danger); font-size: 13px; min-height: 18px; }
.janela .fim { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.icones { display: flex; flex-wrap: wrap; gap: 6px; }
.icones button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.icones button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* assistente */
.ia { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 64px - 44px); }
.lado { border-right: 1px solid var(--border); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.lado .btn { justify-content: center; }
.lado h5 { margin: 8px 4px 0; font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--faint); }
.conv { text-align: left; border: 0; background: none; border-radius: 9px; padding: 8px 10px; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv[aria-current="true"], .conv:hover { background: var(--surface-2); color: var(--text); }
.chat { display: flex; flex-direction: column; min-width: 0; }
.modulos { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.mod { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); }
.restam { margin-left: auto; color: var(--muted); font-size: 13px; }
.msgs { flex: 1; overflow-y: auto; padding: 22px 20px 8px; }
.msgs .in { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.boas { text-align: center; padding: 34px 8px 10px; }
.boas h2 { margin: 0; font-size: 22px; }
.boas p { color: var(--muted); margin: 6px 0 18px; }
.sugs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; text-align: left; }
.sug { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--text); text-align: left; }
.sug:hover { border-color: var(--accent); }
.faixa { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; text-align: left; }
.eu { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--on-accent); border-radius: 16px 16px 4px 16px; padding: 10px 14px; }
.ela { align-self: flex-start; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px; padding: 14px 16px; }
.ela p { margin: 0 0 8px; }
.passos { display: grid; gap: 4px; margin-bottom: 10px; }
.passo { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.passo .gira { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: gira .8s linear infinite; }
.passo .feito { color: var(--ok); }
@keyframes gira { to { transform: rotate(360deg); } }
.tab { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0 10px; }
.tab th, .tab td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.tab th { font-size: 12px; color: var(--muted); font-weight: 650; background: var(--surface-2); }
.tab td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tab-rolo { overflow-x: auto; }
.fonte { font-size: 12.5px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.resp-acoes { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.envio { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 20px 4px; }
.envio form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.envio textarea { flex: 1; resize: none; border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-height: 44px; max-height: 140px; }
.envio .rodape { padding: 8px 0 10px; }
.so-cel { display: none; }

@media (max-width: 860px) {
  .ia { grid-template-columns: 1fr; }
  .lado { display: none; }
  .lado.aberto { display: flex; position: fixed; inset: 108px 0 0 0; z-index: 35; }
  .so-cel { display: grid; }
}
@media (max-width: 640px) {
  .demo { position: static; }
  .selo .tx { display: none; }
  .item .txt { flex: 1 1 calc(100% - 100px); }
  .item > .btn.mini { margin-left: auto; }
  .item > .btn.mini + .btn.mini { margin-left: 0; }
  .quem { display: none; }
  .marca .t2 { display: none; }
  .duas { grid-template-columns: 1fr; }
  .demo .push { margin-left: 0; }
  .item { flex-wrap: wrap; }
  .eu { max-width: 92%; }
}

/* aviso flutuante */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.t { background: var(--text); color: var(--bg); border-radius: 12px; padding: 11px 14px; font-size: 14px; box-shadow: var(--shadow); animation: entra .2s ease both; }
</style>
</head>
<body>
<div class="demo" role="region" aria-label="Controles da demonstração">
  <div class="in">
    <span><b>Demonstração</b> <span class="tag">· navegável, com dados fictícios · nada é gravado</span></span>
    <span class="grp"><span class="seg" role="group" aria-label="Aplicação">
      <button type="button" data-demo="produto" data-v="central">Central de Aplicações</button>
      <button type="button" data-demo="produto" data-v="ia">Assistente IA</button>
    </span></span>

function salvarAtalho() {
  const f = formAtalho;
  const titulo = $("#f-titulo").value.trim(), url = $("#f-url").value.trim(), modo = $("#f-modo").value;
  const deps = [...document.querySelectorAll(".f-dep:checked")].map((x) => x.value);
  const erro = (m) => { $("#f-erro").textContent = m; };
  if (!titulo) return erro("Dê um título ao atalho.");
  if (url && !/^(https?:\/\/[^\s]+|\/[^\s]*)$/i.test(url)) return erro("Endereço inválido: use https://, http:// ou um caminho começando com /.");
  if (modo === "departamentos" && !deps.length) return erro("Marque pelo menos um departamento.");
  const dados = { titulo, descricao: $("#f-desc").value.trim(), url, abrir: $("#f-abrir").value, situacao: $("#f-sit").value,
    icone: f.icone, modo, deps: modo === "departamentos" ? deps : [], fim: $("#f-fim").checked };
  if (f.novo) {
    let chave = slug(titulo); while (S.atalhos.some((a) => a.chave === chave)) chave += "-2";
    const novo = { chave, codigo: "SVC-" + chave.toUpperCase().slice(0, 10), soAdmin: false, ...dados };
    const iFim = S.atalhos.findIndex((a) => a.fim);
    if (dados.fim || iFim < 0) S.atalhos.push(novo); else S.atalhos.splice(iFim, 0, novo);
    registrar(titulo, `criado · ${regraTexto(novo)}${url ? "" : " · sem destino"}`);
    toast(`Atalho "${titulo}" criado.`);
  } else {
    const a = S.atalhos.find((x) => x.chave === f.chave); const antes = regraTexto(a);
    Object.assign(a, dados);
    if (a.fim) { S.atalhos = S.atalhos.filter((x) => x !== a).concat(a); }
    registrar(titulo, `editado · visível para: ${regraTexto(a)} (antes: ${antes})`);
    toast("Atalho salvo.");
  }
  formAtalho = null; render();
}

/* ───────────── Central: ordem por arraste e teclado ───────────── */
function ligarOrdem() {
  const lista = $("#lista-atalhos"); if (!lista) return;
  const moveis = () => [...lista.querySelectorAll(".item")].filter((el) => el.querySelector("button.alca"));
  const marcar = () => { S.ordemPendente = moveis().map((el) => el.dataset.chave); };
  lista.querySelectorAll("button.alca").forEach((h) => {
    h.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      const item = h.closest(".item"); const ms = moveis(); const i = ms.indexOf(item);
      const j = e.key === "ArrowUp" ? i - 1 : i + 1; if (j < 0 || j >= ms.length) return;
      if (e.key === "ArrowUp") lista.insertBefore(item, ms[j]); else lista.insertBefore(ms[j], item);
      marcar(); const k = item.dataset.chave; render(); $(`[data-alca="${CSS.escape(k)}"]`)?.focus();
    });
    h.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return; e.preventDefault();
      const item = h.closest(".item"); item.classList.add("arrastando"); document.body.classList.add("ordenando");
      const ctl = new AbortController(); let mudou = false;
      const mover = (ev) => {
        const ms = moveis().filter((el) => el !== item);
        let alvo = null; for (const el of ms) { const r = el.getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { alvo = el; break; } }
        const depois = alvo ? alvo : (ms.length ? ms[ms.length - 1].nextSibling : null);
        if (alvo ? item.nextElementSibling !== alvo : item !== ms[ms.length - 1]?.nextElementSibling) {
          if (alvo) lista.insertBefore(item, alvo); else lista.insertBefore(item, depois); mudou = true;
        }
        if (ev.clientY < 60) scrollBy(0, -12); else if (ev.clientY > innerHeight - 60) scrollBy(0, 12);
      };
      const soltar = () => { ctl.abort(); item.classList.remove("arrastando"); document.body.classList.remove("ordenando"); if (mudou) { marcar(); render(); } };
      addEventListener("pointermove", mover, { signal: ctl.signal });
      addEventListener("pointerup", soltar, { signal: ctl.signal });
      addEventListener("pointercancel", soltar, { signal: ctl.signal });
      addEventListener("blur", soltar, { signal: ctl.signal });
    });
  });
}

function perguntar(texto) {
  texto = texto.trim(); if (!texto) return;
  const p = eu();
  if (!ehFixo(p.email) && S.ia.perguntasHoje >= S.ia.limite) { toast("Você chegou ao limite de perguntas de hoje."); return; }
  let c = S.ia.conversas.find((x) => x.id === S.ia.atual);
  if (!c) { c = { id: Date.now(), titulo: texto.slice(0, 48), msgs: [] }; S.ia.conversas.unshift(c); S.ia.atual = c.id; }
  c.msgs.push({ de: "eu", texto });
  if (!ehFixo(p.email)) S.ia.perguntasHoje++;
  const r = responder(texto);
  const m = { de: "ia", passos: r.passos, passoAtual: 0, pronta: false, html: r.html, fonte: r.fonte, tabela: r.tabela };
  c.msgs.push(m); render(); rolarFim();
  const passo = () => {
    m.passoAtual++;
    if (m.passoAtual >= m.passos.length) { m.pronta = true; render(); rolarFim(); return; }
    render(); rolarFim(); setTimeout(passo, 650);
  };
  setTimeout(passo, 650);
}
const rolarFim = () => { const el = $("#msgs"); if (el) el.scrollTop = el.scrollHeight; };

});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (formAtalho) { formAtalho = null; render(); } else if (S.credito) { S.credito = null; render(); $(".credito-btn")?.focus(); } }
  if (e.target.id === "pergunta" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
});
$("#d-perfil").addEventListener("change", (e) => { S.perfil = e.target.value; S.tela = S.produto === "ia" ? "ia-chat" : "inicio"; S.ordemPendente = null; render(); });
$("#d-cenario").addEventListener("change", (e) => trocarCenario(e.target.value));

/* links do portfólio: ?app=ia|central e ?cenario=config abrem a demonstração já no ponto certo */
const q = new URLSearchParams(location.search);
if (q.get("cenario") === "config") { $("#d-cenario").value = "config"; S.cenario = "config"; cenarioConfig(); }
if (q.get("app") === "ia") { S.produto = "ia"; S.tela = "ia-chat"; }

render();
})();
</script>
</body>
</html>
